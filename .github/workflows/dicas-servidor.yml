name: Dicas — publicar servidor

# Corre no repositório PÚBLICO (minutos grátis), mas o código do servidor está no repositório privado
# Cappuccin0PT/Unlockify-hub (pasta worker/), que é descarregado com o token CODIGO_TOKEN.
# Corre à mão em Actions → "Dicas — publicar servidor" sempre que mudares algo em worker/.
#
# Secrets (neste repositório público):
#   CODIGO_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, TIPS_TOKEN_SECRET
#   Opcionais (capas da biblioteca pelo IGDB): TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET
#   Opcional (lista de doadores do Ko-fi): KOFI_TOKEN
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dicas-servidor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # (os Secrets não podem ser usados em "if:", por isso passam por aqui)
      HAS_IGDB: ${{ secrets.TWITCH_CLIENT_ID != '' && secrets.TWITCH_CLIENT_SECRET != '' }}
      HAS_KOFI: ${{ secrets.KOFI_TOKEN != '' }}
    steps:
      - name: Código do repositório privado
        uses: actions/checkout@v4
        with:
          repository: Cappuccin0PT/Unlockify-hub
          token: ${{ secrets.CODIGO_TOKEN }}
          persist-credentials: false
      - name: ID da base de dados (Secret D1_DATABASE_ID)
        run: sed -i "s/COLA_AQUI_O_DATABASE_ID/${{ secrets.D1_DATABASE_ID }}/" worker/wrangler.toml
      - name: Tabelas da base de dados (só cria o que falta)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute unlockify-tips --remote --file=schema.sql
      - name: Migração 001 (aviso "Missable"; dá erro se já foi aplicada, é normal)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute unlockify-tips --remote --file=migrations/001-missable.sql
      - name: Migração 002 (aviso "Impossível de obter"; dá erro se já foi aplicada, é normal)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute unlockify-tips --remote --file=migrations/002-unobtainable.sql
      - name: Migração 003 (nomes dos jogos para o painel de administração; dá erro se já foi aplicada, é normal)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute unlockify-tips --remote --file=migrations/003-names.sql
      - name: Publicar o servidor (com capas IGDB)
        if: env.HAS_IGDB == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            TOKEN_SECRET
            TWITCH_CLIENT_ID
            TWITCH_CLIENT_SECRET
        env:
          TOKEN_SECRET: ${{ secrets.TIPS_TOKEN_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Publicar o servidor (sem capas IGDB)
        if: env.HAS_IGDB != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: TOKEN_SECRET
        env:
          TOKEN_SECRET: ${{ secrets.TIPS_TOKEN_SECRET }}
      - name: Segredo do Ko-fi (lista de doadores)
        if: env.HAS_KOFI == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: whoami
          secrets: KOFI_TOKEN
        env:
          KOFI_TOKEN: ${{ secrets.KOFI_TOKEN }}
